<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 48 48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#2b3136"/>
      <stop offset=".45" stop-color="#161b1f"/>
      <stop offset="1" stop-color="#0c0f12"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa031"/>
      <stop offset=".55" stop-color="#ff6a0d"/>
      <stop offset="1" stop-color="#c23c05"/>
    </linearGradient>
    <clipPath id="win"><circle cx="24" cy="24" r="12.4"/></clipPath>
  </defs>

  <!-- plate -->
  <rect x="1" y="1" width="46" height="46" rx="11" fill="url(#plate)" stroke="#05080a" stroke-width="2"/>
  <rect x="2.6" y="2.6" width="42.8" height="42.8" rx="9.6" fill="none" stroke="#5a6167" stroke-opacity=".5"/>

  <!-- orb well -->
  <circle cx="24" cy="24" r="13.4" fill="#07090b"/>

  <!-- liquid, a touch over half, with a wave surface -->
  <g clip-path="url(#win)">
    <path d="M11 22.6 Q15 20.9 18.5 22.6 T26 22.6 T33.5 22.6 T41 22.6 L41 38 L11 38 Z" fill="url(#liq)"/>
    <path d="M11 22.6 Q15 20.9 18.5 22.6 T26 22.6 T33.5 22.6 T41 22.6"
          fill="none" stroke="#ffd9a0" stroke-opacity=".75" stroke-width="1"/>
  </g>

  <!-- rim -->
  <circle cx="24" cy="24" r="13.4" fill="none" stroke="#6d6152" stroke-width="1.6"/>
  <circle cx="24" cy="24" r="12.1" fill="none" stroke="#ff8a2b" stroke-opacity=".35" stroke-width="1"/>

  <!-- the regeneration sweep, the thing that makes this plugin what it is -->
  <circle cx="24" cy="24" r="16.6" fill="none" stroke="#ffd98f" stroke-width="2.1"
          pathLength="1" stroke-dasharray="0.66 1" transform="rotate(-90 24 24)" stroke-linecap="butt"/>
</svg>
